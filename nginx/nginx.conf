worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen       80;
        server_name  localhost;

        # Angular compilado se copia a html/clinica dentro de nginx.
        root   html/clinica;
        index  index.html;

        # Rutas de Angular: si no existe el archivo, devolver index.html.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # NestJS y Swagger, administrados por PM2 en el puerto 3000.
        location /api {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}

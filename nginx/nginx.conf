# Configuración de nginx para la clínica.
# Copiar a C:\nginx\conf\nginx.conf.
# IMPORTANTE: cambiar la línea "root" por la ruta del proyecto en tu compu.

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen       80;
        server_name  localhost;

        # Angular compilado (npm run build en frontend)
        root   C:/Users/LucasB/Desktop/AppWebTFI/frontend/dist/frontend/browser;
        index  index.html;

        # Rutas de Angular (/login, /reservas...): si no es un archivo, devolver index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API y Swagger: reenviar al backend que mantiene PM2
        location /api {
            proxy_pass http://localhost:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
